name: Combo auditor tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/auditor/package-lock.json
      - name: Install
        run: npm ci --prefix packages/auditor
      - name: Build and test
        run: npm test --prefix packages/auditor
